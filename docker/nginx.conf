# akochandaaaaa を静的に出す nginx（コンテナの中。uid 10001 で動く。書けるのは /tmp だけ）。
# ホストの nginx（sagisawa-expose）は /akochandaaaaa/... をそのままの URI でここへ渡す。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 256;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	# 入口のログはホストの nginx が持つ
	access_log off;
	server_tokens off;
	sendfile on;
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	# ビルドのときに作った .gz を優先して出す（main.data が大きい）。無いものはその場で縮める
	gzip_static on;
	gzip on;
	gzip_vary on;
	gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

	server {
		listen 3130;
		root /usr/share/nginx/html;
		# 転送は相対の Location で返す（コンテナの中のポートを外に見せない）
		absolute_redirect off;

		# 見回り用（ゲートを通さない。秘密は返さない）
		location = /akochandaaaaa/api/health {
			default_type application/json;
			add_header Cache-Control "no-store" always;
			return 200 '{"ok":true}';
		}
		location = /akochandaaaaa {
			return 301 /akochandaaaaa/;
		}
		# ファイル名に中身のハッシュが付くもの
		location /akochandaaaaa/assets/ {
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			try_files $uri =404;
		}
		# index.html・main.js/wasm/data・牌の絵は名前が変わらないので、毎回確かめる（ETag）
		location /akochandaaaaa/ {
			add_header Cache-Control "no-cache" always;
			try_files $uri $uri/ =404;
		}
		location / {
			return 404;
		}
	}
}
